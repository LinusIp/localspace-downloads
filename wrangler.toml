# Deployed by hand with `npx wrangler deploy`, only on the founder's go.
name = "localspace"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
# Only the one address above; no per-version preview addresses.
preview_urls = false
send_metrics = false

# No request logs are kept.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "localspace-downloads"
database_id = "9da33545-5456-4aca-aa42-175fa38d2d7a"

# Empty until the release is published: an empty URL answers "not published
# yet" and counts nothing. STATS_KEY is a secret, set with
# `npx wrangler secret put STATS_KEY`, never written here.
[vars]
WINDOWS_URL = "https://github.com/LinusIp/localSpace-releases/releases/download/v0.2.0-preview.1/localSpace-0.2.0-920b7123-windows-x64-setup.exe"
PORTABLE_URL = "https://github.com/LinusIp/localSpace-releases/releases/download/v0.2.0-preview.1/localSpace-0.2.0-920b7123-windows-x64-portable.zip"
